[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-minds"
version = "0.2.0"
description = "Portable cognitive machinery runtime for evidence-first local pipelines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
foundry = ["psutil>=5.9"]
workspace-memory = ["numpy>=1.24"]
dev = ["numpy>=1.24", "psutil>=5.9", "pytest>=8.0"]

[project.scripts]
tiny-minds = "tiny_minds.cli:main"

[project.entry-points."tiny_minds.integrations"]
generic-workspace = "tiny_minds.integrations.generic:extension"

[tool.setuptools.packages.find]
include = ["tiny_minds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sterile: builds and installs the base wheel into a fresh isolated environment"]
