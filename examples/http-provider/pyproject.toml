[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-minds-example-http-provider"
version = "0.2.0"
description = "Example HTTP model-provider extension for Tiny Minds"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["tiny-minds==0.2.0"]

[project.entry-points."tiny_minds.providers"]
example-http = "tiny_minds_example_http:extension"

[tool.setuptools.packages.find]
include = ["tiny_minds_example_http*"]
